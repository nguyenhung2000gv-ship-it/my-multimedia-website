    <h1>Thư viện Ảnh Hệ sinh thái Đại dương</h1>
    <p>Khám phá vẻ đẹp kỳ diệu của các rạn san hô và sinh vật biển qua các khung hình chất lượng cao.</p>

    <!-- Grid Thư viện ảnh đáp ứng 1 - 2 - 3 cột -->
    <div class="media-grid" style="margin-top: 20px;">
      
      <!-- Ảnh 1 -->
      <figure style="margin: 0; background: #f4f4f4; padding: 10px; border-radius: 8px;">
        <picture>
          <!-- Có thể thay thế src bằng đường dẫn ảnh thực tế của bạn -->

        <figcaption style="margin-top: 8px; font-size: 0.9rem;">Hình 1: Rạn san hô tự nhiên tại Vịnh Nha Trang.</figcaption>
      </figure>

      <!-- Ảnh 2 -->
